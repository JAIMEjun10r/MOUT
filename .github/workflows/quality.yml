name: Qualidade e testes

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    name: Lint, formatação e Cypress
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CYPRESS_BASE_URL: https://front.serverest.dev
      CYPRESS_API_URL: https://serverest.dev

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar o Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.19.0

      - name: Executar qualidade e testes
        uses: cypress-io/github-action@c541a95ea92d9239347a2355f2e895cd4b3f8060 # v7.4.6
        with:
          command: npm test

      - name: Publicar evidências de falha
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cypress-artifacts-${{ github.run_attempt }}
          path: |
            artifacts/screenshots
            artifacts/videos
          if-no-files-found: ignore
          retention-days: 7
